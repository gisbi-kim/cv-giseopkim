name: Build and verify CV
on:
  push:
    branches: [main]
    paths: ['main.tex', 'scripts/**', 'assets/fonts/**', '.github/workflows/build-cv.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cv-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and fonts
        run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core latexmk poppler-utils
      - name: Build and verify
        run: |
          python3 scripts/build.py
          python3 scripts/verify_cv.py
          pdftotext main.pdf /tmp/cv.txt
          test -s /tmp/cv.txt
          git diff --check
      - name: Publish generated CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.pdf README.md revision.tex
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild synchronized CV PDF and README"
            git push
          fi
